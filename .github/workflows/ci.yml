name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck strict
        run: npm run lint

      - name: Tests unitaires (moteur, patterns, règles métier, crypto)
        run: npm test

      - name: Build statique + service worker
        run: npm run build

      - name: Chromium Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E — audit zéro réseau, parcours saisie, sauvegarde, verrou
        run: npm run e2e

      - name: Garde de parité pixel vs prototype
        run: npm run parity

      - name: Artefacts de parité (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-out
          path: parity-out/
          if-no-files-found: ignore
